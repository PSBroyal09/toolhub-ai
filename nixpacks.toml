[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack disable || true",
  "npx --yes pnpm@11.18.0 install --frozen-lockfile"
]

[phases.build]
cmds = [
  "cd apps/api && npx --yes pnpm@11.18.0 exec prisma generate",
  "cd apps/api && npx --yes pnpm@11.18.0 exec nest build"
]

[start]
cmd = "cd apps/api && npx --yes pnpm@11.18.0 exec prisma migrate deploy && npx --yes pnpm@11.18.0 exec prisma db seed && node dist/main"
