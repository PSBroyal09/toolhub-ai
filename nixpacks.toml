[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack disable || true",
  "npx --yes pnpm@11.18.0 install --frozen-lockfile"
]

[phases.build]
cmds = [
  "npx --yes pnpm@11.18.0 --filter api exec prisma generate",
  "npx --yes pnpm@11.18.0 --filter api build"
]

[start]
cmd = "npx --yes pnpm@11.18.0 --filter api exec prisma migrate deploy && npx --yes pnpm@11.18.0 --filter api exec prisma db seed && npx --yes pnpm@11.18.0 --filter api start:prod"
